<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钓鱼地图 - 图片管理后台</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .login-box h2 { margin-bottom: 20px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; }
        .login-box button { width: 100%; padding: 12px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .login-box button:hover { background: #40a9ff; }
        .error { color: #ff4d4f; text-align: center; margin-top: 10px; }

        .header { background: white; padding: 16px 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 20px; }
        .header nav { display: flex; gap: 8px; flex-wrap: wrap; }
        .header nav button { padding: 8px 16px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .header nav button.active { background: #1890ff; color: white; border-color: #1890ff; }
        .header nav button .badge { background: #ff4d4f; color: white; border-radius: 10px; padding: 1px 6px; font-size: 11px; margin-left: 4px; }

        .server-info { background: #e6f7ff; padding: 10px 16px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .server-info code { background: #fff; padding: 2px 6px; border-radius: 3px; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .stat-card .num { font-size: 32px; font-weight: bold; color: #1890ff; }
        .stat-card .label { color: #666; margin-top: 4px; }

        .filters { background: white; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .filters input, .filters select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; }
        .filters button { padding: 8px 16px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; }

        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .image-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .image-card img { width: 100%; height: 180px; object-fit: cover; }
        .image-card .info { padding: 12px; font-size: 12px; }
        .image-card .info div { margin: 4px 0; }
        .image-card .info .uid { color: #1890ff; }
        .image-card .info .status-active { color: #52c41a; }
        .image-card .info .status-replaced { color: #faad14; }
        .image-card .info .status-recycled { color: #ff4d4f; }
        .image-card .info .url { color: #999; word-break: break-all; font-size: 11px; background: #f9f9f9; padding: 4px 6px; border-radius: 3px; margin-top: 4px; }
        .image-card .info .expire { color: #ff4d4f; font-weight: 500; }
        .image-card .actions { padding: 8px 12px; border-top: 1px solid #f0f0f0; display: flex; gap: 8px; }
        .image-card .actions button { flex: 1; padding: 6px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-replace { background: #faad14; color: white; }
        .btn-delete { background: #ff4d4f; color: white; }
        .btn-copy { background: #1890ff; color: white; }
        .btn-restore { background: #52c41a; color: white; }
        .btn-perm-delete { background: #a8071a; color: white; }

        .settings-panel { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .settings-panel h3 { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
        .settings-panel .form-group { margin-bottom: 16px; }
        .settings-panel label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
        .settings-panel input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .settings-panel .btn-save { padding: 10px 24px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .settings-panel .success { color: #52c41a; margin-top: 12px; }

        .recycle-notice { background: #fff7e6; padding: 12px 16px; border-radius: 4px; margin-bottom: 20px; border-left: 4px solid #faad14; }
        .recycle-notice p { color: #8c6c0a; font-size: 14px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 24px; border-radius: 8px; max-width: 500px; width: 90%; }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; }
        .modal-content .btn-group { display: flex; gap: 12px; margin-top: 16px; }
        .modal-content .btn-group button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-cancel { background: #f0f0f0; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .pagination button { padding: 8px 16px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination button.active { background: #1890ff; color: white; border-color: #1890ff; }

        .loading { text-align: center; padding: 40px; color: #999; }
        .empty { text-align: center; padding: 60px 20px; color: #999; }
    </style>
</head>
<body>
    <div x-data="adminApp()" x-init="init()">
        <template x-if="!loggedIn">
            <div class="login-box">
                <h2>图片管理后台</h2>
                <input type="text" x-model="username" placeholder="用户名" @keyup.enter="login()">
                <input type="password" x-model="password" placeholder="密码" @keyup.enter="login()">
                <button @click="login()">登录</button>
                <div class="error" x-show="loginError" x-text="loginError"></div>
            </div>
        </template>

        <template x-if="loggedIn">
            <div class="container">
                <div class="header">
                    <h1>钓鱼地图 - 图片管理后台</h1>
                    <nav>
                        <button :class="{ active: tab === 'images' }" @click="switchTab('images')">
                            图片管理
                        </button>
                        <button :class="{ active: tab === 'recycle' }" @click="switchTab('recycle')">
                            回收站<span class="badge" x-show="recycleCount > 0" x-text="recycleCount"></span>
                        </button>
                        <button :class="{ active: tab === 'settings' }" @click="switchTab('settings')">
                            系统设置
                        </button>
                    </nav>
                </div>

                <div class="server-info" x-show="serverInfo">
                    服务器IP: <code x-text="serverInfo?.local_ip"></code> |
                    端口: <code x-text="serverInfo?.port"></code> |
                    测试地址: <code x-text="serverInfo?.test_url"></code>
                </div>

                <template x-if="tab === 'images'">
                    <div>
                        <div class="stats" x-show="stats">
                            <div class="stat-card">
                                <div class="num" x-text="stats?.total"></div>
                                <div class="label">总图片数</div>
                            </div>
                            <div class="stat-card">
                                <div class="num" x-text="stats?.active"></div>
                                <div class="label">正常</div>
                            </div>
                            <div class="stat-card">
                                <div class="num" x-text="stats?.replaced"></div>
                                <div class="label">已替换</div>
                            </div>
                            <div class="stat-card">
                                <div class="num" style="color:#ff4d4f" x-text="stats?.recycled"></div>
                                <div class="label">回收站</div>
                            </div>
                        </div>

                        <div class="filters">
                            <input type="text" x-model="filters.uid" placeholder="用户UID">
                            <input type="text" x-model="filters.spot_id" placeholder="钓点ID">
                            <select x-model="filters.type">
                                <option value="">全部类型</option>
                                <option value="avatar">头像</option>
                                <option value="fishing_spot">钓点</option>
                                <option value="catch">渔获</option>
                            </select>
                            <select x-model="filters.status">
                                <option value="">全部状态</option>
                                <option value="active">正常</option>
                                <option value="replaced">已替换</option>
                            </select>
                            <button @click="loadImages()">搜索</button>
                        </div>

                        <div class="image-grid">
                            <template x-for="img in images" :key="img.id">
                                <div class="image-card">
                                    <img :src="img.image_url" :alt="img.id" @error="$el.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22180%22><rect fill=%22%23f0f0f0%22 width=%22280%22 height=%22180%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23999%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2214%22>图片已删除</text></svg>'">
                                    <div class="info">
                                        <div>UID: <span class="uid" x-text="img.uid"></span></div>
                                        <div>类型: <span x-text="typeLabel(img.type)"></span></div>
                                        <div x-show="img.spot_id">钓点: <span x-text="img.spot_id"></span></div>
                                        <div>IP: <span x-text="img.client_ip"></span></div>
                                        <div>状态: <span :class="'status-' + img.status" x-text="statusLabel(img.status)"></span></div>
                                        <div x-show="img.replace_reason" style="color:#ff4d4f" x-text="img.replace_reason"></div>
                                        <div class="url" x-text="serverInfo?.test_url + img.image_url"></div>
                                        <div style="color:#999;margin-top:4px" x-text="img.created_at"></div>
                                    </div>
                                    <div class="actions">
                                        <button class="btn-copy" @click="copyUrl(img)">复制链接</button>
                                        <button class="btn-replace" @click="openReplace(img)">替换</button>
                                        <button class="btn-delete" @click="recycleImage(img.id)">删除</button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="empty" x-show="!loading && images.length === 0">暂无图片</div>
                        <div class="loading" x-show="loading">加载中...</div>

                        <div class="pagination" x-show="totalPages > 1">
                            <button @click="page--; loadImages()" :disabled="page <= 1">上一页</button>
                            <span style="padding: 8px" x-text="page + ' / ' + totalPages"></span>
                            <button @click="page++; loadImages()" :disabled="page >= totalPages">下一页</button>
                        </div>
                    </div>
                </template>

                <template x-if="tab === 'recycle'">
                    <div>
                        <div class="recycle-notice">
                            <p>回收站中的图片保留 <strong>7天</strong>，过期后将永久删除。您可以还原或立即永久删除。</p>
                        </div>

                        <div class="image-grid">
                            <template x-for="img in recycleImages" :key="img.id">
                                <div class="image-card">
                                    <img :src="img.image_url" :alt="img.id" @error="$el.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22180%22><rect fill=%22%23f0f0f0%22 width=%22280%22 height=%22180%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23999%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2214%22>文件已不存在</text></svg>'">
                                    <div class="info">
                                        <div>UID: <span class="uid" x-text="img.uid"></span></div>
                                        <div>类型: <span x-text="typeLabel(img.type)"></span></div>
                                        <div x-show="img.spot_id">钓点: <span x-text="img.spot_id"></span></div>
                                        <div>删除时间: <span x-text="img.deleted_at"></span></div>
                                        <div class="expire" x-show="img.deleted_at">
                                            剩余: <span x-text="daysLeft(img.deleted_at)"></span> 天
                                        </div>
                                        <div x-show="img.replace_reason" style="color:#ff4d4f" x-text="img.replace_reason"></div>
                                    </div>
                                    <div class="actions">
                                        <button class="btn-restore" @click="restoreImage(img.id)">还原</button>
                                        <button class="btn-perm-delete" @click="permanentDelete(img.id)">永久删除</button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="empty" x-show="!recycleLoading && recycleImages.length === 0">回收站为空</div>
                        <div class="loading" x-show="recycleLoading">加载中...</div>

                        <div class="pagination" x-show="recycleTotalPages > 1">
                            <button @click="recyclePage--; loadRecycle()" :disabled="recyclePage <= 1">上一页</button>
                            <span style="padding: 8px" x-text="recyclePage + ' / ' + recycleTotalPages"></span>
                            <button @click="recyclePage++; loadRecycle()" :disabled="recyclePage >= recycleTotalPages">下一页</button>
                        </div>
                    </div>
                </template>

                <template x-if="tab === 'settings'">
                    <div class="settings-panel">
                        <h3>系统设置</h3>
                        <div class="form-group">
                            <label>图片存储目录</label>
                            <input type="text" x-model="settingsForm.image_dir" placeholder="/data/fishmap/images">
                        </div>
                        <div class="form-group">
                            <label>数据库路径</label>
                            <input type="text" x-model="settingsForm.db_path" placeholder="/data/fishmap/db/images.db">
                        </div>
                        <div class="form-group">
                            <label>管理员用户名</label>
                            <input type="text" x-model="settingsForm.admin_user" placeholder="admin">
                        </div>
                        <div class="form-group">
                            <label>管理员密码</label>
                            <input type="password" x-model="settingsForm.admin_password" placeholder="留空则不修改">
                        </div>
                        <div class="form-group">
                            <label>最大文件大小 (MB)</label>
                            <input type="number" x-model.number="settingsForm.max_file_size_mb" placeholder="20">
                        </div>
                        <button class="btn-save" @click="saveSettings()">保存设置</button>
                        <button class="btn-save" style="background:#ff4d4f;margin-left:12px" @click="restartService()">重启服务</button>
                        <button class="btn-save" style="background:#faad14;margin-left:12px" @click="cleanupFiles()">清理残留文件</button>
                        <div class="success" x-show="settingsSaved">设置已保存，重启服务后生效</div>
                    </div>
                </template>

                <div class="modal" x-show="showReplaceModal" @click.self="showReplaceModal = false">
                    <div class="modal-content">
                        <h3>替换图片</h3>
                        <p style="margin-bottom: 12px; color: #666;">用户UID: <span x-text="currentImage?.uid"></span></p>
                        <input type="file" @change="replaceFile = $event.target.files[0]" accept="image/*">
                        <input type="text" x-model="replaceReason" placeholder="替换原因（默认：不符合平台规范）">
                        <div class="btn-group">
                            <button class="btn-cancel" @click="showReplaceModal = false">取消</button>
                            <button class="btn-primary" @click="confirmReplace()">确认替换</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script>
        function adminApp() {
            return {
                loggedIn: false,
                token: localStorage.getItem('admin_token') || '',
                username: '',
                password: '',
                loginError: '',
                tab: 'images',
                serverInfo: null,
                stats: null,
                images: [],
                filters: { uid: '', spot_id: '', type: '', status: '' },
                page: 1,
                size: 20,
                total: 0,
                totalPages: 1,
                loading: false,
                showReplaceModal: false,
                currentImage: null,
                replaceFile: null,
                replaceReason: '不符合平台规范',
                settingsForm: { image_dir: '', db_path: '', admin_user: '', admin_password: '', max_file_size_mb: 20 },
                settingsSaved: false,
                recycleImages: [],
                recyclePage: 1,
                recycleTotal: 0,
                recycleTotalPages: 1,
                recycleLoading: false,
                recycleCount: 0,

                init() {
                    if (this.token) {
                        this.tryAutoLogin();
                    }
                },

                getHeaders() {
                    return { 'X-Admin-Token': this.token };
                },

                async fetchAuth(url, opts = {}) {
                    const res = await fetch(url, { ...opts, headers: { ...opts.headers, ...this.getHeaders() } });
                    if (res.status === 401) {
                        this.token = '';
                        this.loggedIn = false;
                        localStorage.removeItem('admin_token');
                        throw new Error('unauthorized');
                    }
                    return res;
                },

                async tryAutoLogin() {
                    try {
                        const res = await this.fetchAuth('/admin/api/stats');
                        if (!res.ok) throw new Error('fail');
                        this.loggedIn = true;
                        await this.loadAll();
                    } catch (e) {
                        this.loggedIn = false;
                    }
                },

                async login() {
                    this.loginError = '';
                    try {
                        const res = await fetch('/admin/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: this.username, password: this.password })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.token = data.token;
                            this.loggedIn = true;
                            localStorage.setItem('admin_token', this.token);
                            this.loadAll();
                        } else {
                            this.loginError = data.message || '登录失败';
                        }
                    } catch (e) {
                        this.loginError = '网络错误';
                    }
                },

                async loadAll() {
                    await Promise.all([this.loadStats(), this.loadServerInfo(), this.loadImages()]);
                },

                switchTab(newTab) {
                    this.tab = newTab;
                    if (newTab === 'images') this.loadImages();
                    if (newTab === 'recycle') this.loadRecycle();
                    if (newTab === 'settings') this.loadSettings();
                },

                async loadStats() {
                    try {
                        const res = await this.fetchAuth('/admin/api/stats');
                        this.stats = await res.json();
                        this.recycleCount = this.stats?.recycled || 0;
                    } catch (e) { console.error(e); }
                },

                async loadServerInfo() {
                    try {
                        const res = await this.fetchAuth('/admin/api/info');
                        this.serverInfo = await res.json();
                    } catch (e) { console.error(e); }
                },

                async loadImages() {
                    this.loading = true;
                    try {
                        const params = new URLSearchParams({
                            page: this.page,
                            size: this.size,
                            ...Object.fromEntries(Object.entries(this.filters).filter(([_, v]) => v))
                        });
                        const res = await this.fetchAuth(`/admin/api/images?${params}`);
                        const data = await res.json();
                        this.images = data.images;
                        this.total = data.total;
                        this.totalPages = Math.ceil(this.total / this.size);
                    } catch (e) { console.error(e); }
                    this.loading = false;
                },

                async loadRecycle() {
                    this.recycleLoading = true;
                    try {
                        const res = await this.fetchAuth(`/admin/api/recycle?page=${this.recyclePage}&size=${this.size}`);
                        const data = await res.json();
                        this.recycleImages = data.images;
                        this.recycleTotal = data.total;
                        this.recycleTotalPages = Math.ceil(this.recycleTotal / this.size);
                    } catch (e) { console.error(e); }
                    this.recycleLoading = false;
                },

                async loadSettings() {
                    try {
                        const res = await this.fetchAuth('/admin/api/settings');
                        const data = await res.json();
                        this.settingsForm = {
                            image_dir: data.image_dir || '',
                            db_path: data.db_path || '',
                            admin_user: data.admin_user || '',
                            admin_password: '',
                            max_file_size_mb: data.max_file_size_mb || 20
                        };
                    } catch (e) { console.error(e); }
                },

                async saveSettings() {
                    try {
                        const data = {};
                        if (this.settingsForm.image_dir) data.image_dir = this.settingsForm.image_dir;
                        if (this.settingsForm.db_path) data.db_path = this.settingsForm.db_path;
                        if (this.settingsForm.admin_user) data.admin_user = this.settingsForm.admin_user;
                        if (this.settingsForm.admin_password) data.admin_password = this.settingsForm.admin_password;
                        if (this.settingsForm.max_file_size_mb) data.max_file_size_mb = parseInt(this.settingsForm.max_file_size_mb);

                        const res = await this.fetchAuth('/admin/api/settings', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        if (res.ok) {
                            this.settingsSaved = true;
                            setTimeout(() => { this.settingsSaved = false; }, 3000);
                        }
                    } catch (e) { console.error(e); }
                },

                async restartService() {
                    if (!confirm('确定重启服务？重启后需等待约3秒刷新页面。')) return;
                    try {
                        const res = await this.fetchAuth('/admin/api/restart', { method: 'POST' });
                        if (res.ok) {
                            alert('正在重启...');
                            await new Promise(r => setTimeout(r, 3000));
                            location.reload();
                        }
                    } catch (e) {
                        alert('服务正在重启，请稍后刷新页面');
                        setTimeout(() => location.reload(), 3000);
                    }
                },

                async cleanupFiles() {
                    if (!confirm('确定清理残留文件？将删除未被数据库引用的孤儿文件和过期回收站文件。')) return;
                    try {
                        const res = await this.fetchAuth('/admin/api/cleanup', { method: 'POST' });
                        const data = await res.json();
                        alert(`清理完成：孤儿文件 ${data.orphan_removed} 个，过期回收 ${data.expired_cleaned} 个`);
                        this.loadStats();
                    } catch (e) { alert('清理失败'); }
                },

                openReplace(img) {
                    this.currentImage = img;
                    this.replaceFile = null;
                    this.replaceReason = '不符合平台规范';
                    this.showReplaceModal = true;
                },

                async confirmReplace() {
                    if (!this.replaceFile) {
                        alert('请选择替换图片');
                        return;
                    }
                    const formData = new FormData();
                    formData.append('file', this.replaceFile);
                    formData.append('reason', this.replaceReason);

                    try {
                        const res = await this.fetchAuth(`/admin/api/images/${this.currentImage.id}/replace`, {
                            method: 'POST',
                            body: formData
                        });
                        if (res.ok) {
                            this.showReplaceModal = false;
                            this.loadAll();
                        } else {
                            alert('替换失败');
                        }
                    } catch (e) { alert('网络错误'); }
                },

                async recycleImage(id) {
                    if (!confirm('确定删除此图片？将移入回收站保留7天。')) return;
                    try {
                        const res = await this.fetchAuth(`/admin/api/images/${id}/recycle`, { method: 'POST' });
                        if (res.ok) {
                            this.loadAll();
                        } else {
                            alert('删除失败');
                        }
                    } catch (e) { alert('网络错误'); }
                },

                async restoreImage(id) {
                    if (!confirm('确定还原此图片？')) return;
                    try {
                        const res = await this.fetchAuth(`/admin/api/recycle/${id}/restore`, { method: 'POST' });
                        if (res.ok) {
                            this.loadRecycle();
                            this.loadStats();
                        } else {
                            alert('还原失败');
                        }
                    } catch (e) { alert('网络错误'); }
                },

                async permanentDelete(id) {
                    if (!confirm('确定永久删除此图片？此操作不可恢复！')) return;
                    try {
                        const res = await this.fetchAuth(`/admin/api/recycle/${id}/permanent`, { method: 'DELETE' });
                        if (res.ok) {
                            this.loadRecycle();
                            this.loadStats();
                        } else {
                            alert('删除失败');
                        }
                    } catch (e) { alert('网络错误'); }
                },

                async copyUrl(img) {
                    const url = this.serverInfo?.test_url + img.image_url;
                    try {
                        await navigator.clipboard.writeText(url);
                        alert('已复制到剪贴板: ' + url);
                    } catch (e) {
                        prompt('复制链接:', url);
                    }
                },

                typeLabel(type) {
                    const map = { avatar: '头像', fishing_spot: '钓点', catch: '渔获' };
                    return map[type] || type;
                },

                statusLabel(status) {
                    const map = { active: '正常', replaced: '已替换', recycled: '已删除' };
                    return map[status] || status;
                },

                daysLeft(deletedAt) {
                    if (!deletedAt) return 7;
                    const deleted = new Date(deletedAt + 'Z');
                    const now = new Date();
                    const diff = 7 - Math.floor((now - deleted) / (1000 * 60 * 60 * 24));
                    return Math.max(0, diff);
                }
            };
        }
    </script>
</body>
</html>
