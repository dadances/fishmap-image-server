version: "3.8"

services:
  app:
    build: .
    ports:
      - "2026:2026"
    volumes:
      - ./data/fishmap:/data/fishmap
    environment:
      - IMAGE_DIR=/data/fishmap/images
      - BACKUP_DIR=/data/fishmap/images/backup
      - DB_PATH=/data/fishmap/db/images.db
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=fishmap2024
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/fishmap/images:/data/fishmap/images:ro
    depends_on:
      - app
    restart: unless-stopped
